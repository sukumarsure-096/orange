name : Playwright Test CI

on :
  push:
    branches : [ "main" ]
  pull_request:
    branches : [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on : ubuntu-latest
    steps:
    - name : Checkout Code
      uses : actions/checkout@v4
    
    - name : Set up Python
      uses : actions/setup-python@v5
      with:
        python-version : '3.11'

    - name : Install Dependencies
      run : |
          python -m  pip install --upgrade pip
          pip install -r requirements.txt

    - name : Install Playwright
      run : playwright install --with-deps

    - name : Run Tests
      run : |
          pytest Tests/ --browser chromium --screenshot only-on-failure --html=report.html --self-contained-html
    
    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-pytest-report
        path: report.html